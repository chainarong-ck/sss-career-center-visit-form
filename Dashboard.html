<!doctype html>
<html lang="th">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <title>Dashboard ผู้เข้าชมวันนี้</title>

    <style>
      :root {
        --brown: #7a3f1d;
        --brown-dark: #4f2814;
        --green: #4f6f35;
        --cream: #fff7e8;
        --paper: #fffaf0;
        --line: rgba(122, 63, 29, 0.16);
        --text: #2e2118;
        --muted: #76685d;
        --shadow: 0 24px 70px rgba(62, 35, 18, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(255, 214, 143, 0.8), transparent 34%),
          radial-gradient(circle at bottom right, rgba(106, 135, 69, 0.32), transparent 34%),
          linear-gradient(135deg, #fff4dc 0%, #f6dfb7 45%, #ead0a2 100%);
      }

      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero {
        border-radius: 30px;
        padding: 30px;
        background: linear-gradient(135deg, #7a3f1d, #4f6f35);
        color: white;
        box-shadow: var(--shadow);
      }

      .badge {
        display: inline-flex;
        border-radius: 999px;
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.24);
        font-weight: 800;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: clamp(32px, 5vw, 64px);
        line-height: 1.05;
      }

      .subtitle {
        margin: 0;
        color: #fff1c8;
        font-size: 20px;
        font-weight: 700;
      }

      .updated {
        margin-top: 16px;
        color: rgba(255, 255, 255, 0.86);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr 0.8fr;
        gap: 20px;
        margin-top: 24px;
      }

      .card {
        border-radius: 26px;
        background: rgba(255, 250, 240, 0.94);
        border: 1px solid var(--line);
        box-shadow: 0 18px 45px rgba(62, 35, 18, 0.12);
        padding: 24px;
      }

      .main-number {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 230px;
        text-align: center;
      }

      .main-number .label {
        color: var(--muted);
        font-size: 24px;
        font-weight: 800;
      }

      .main-number .number {
        margin-top: 10px;
        color: var(--brown-dark);
        font-size: clamp(82px, 13vw, 170px);
        font-weight: 950;
        line-height: 0.95;
      }

      .main-number .unit {
        margin-top: 8px;
        color: var(--green);
        font-size: 28px;
        font-weight: 900;
      }

      .card h2 {
        margin: 0 0 18px;
        color: var(--brown-dark);
        font-size: 24px;
      }

      .bar-list {
        display: grid;
        gap: 14px;
      }

      .bar-row {
        display: grid;
        gap: 7px;
      }

      .bar-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-weight: 800;
        font-size: 14px;
      }

      .bar-track {
        overflow: hidden;
        height: 14px;
        border-radius: 999px;
        background: #ead8bd;
      }

      .bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--brown), var(--green));
        transition: width 0.35s ease;
      }

      .table-card {
        margin-top: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
      }

      th,
      td {
        padding: 13px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--brown-dark);
        font-size: 14px;
        background: #fff2d8;
      }

      td {
        color: var(--text);
        font-size: 14px;
      }

      .empty {
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: rgba(255, 255, 255, 0.88);
        font-weight: 700;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #8ef0a5;
        box-shadow: 0 0 0 5px rgba(142, 240, 165, 0.18);
      }

      @media (max-width: 980px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }

        .page {
          padding: 14px;
        }

        .hero,
        .card {
          border-radius: 22px;
        }

        table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <section class="hero">
        <div class="badge">Real-time Visitor Dashboard</div>
        <h1>ผู้เข้าชมศูนย์วันนี้</h1>
        <p class="subtitle">ศูนย์การงานอาชีพโรงเรียนศรีศักดิ์สุวรรณวิทยา</p>
        <div class="status">
          <span class="dot"></span>
          <span>ระบบอัปเดตข้อมูลอัตโนมัติทุก 10 วินาที</span>
        </div>
        <div class="updated" id="updatedAt">อัปเดตล่าสุด: -</div>
      </section>

      <section class="stats-grid">
        <div class="card main-number">
          <div class="label">จำนวนผู้ลงทะเบียนเข้าชม</div>
          <div class="number" id="totalVisitors">0</div>
          <div class="unit">คน</div>
        </div>

        <div class="card">
          <h2>ประเภทผู้เข้าร่วม</h2>
          <div id="participantTypes" class="bar-list"></div>
        </div>

        <div class="card">
          <h2>โซนที่สนใจ</h2>
          <div id="zones" class="bar-list"></div>
        </div>
      </section>

      <section class="card table-card">
        <h2>รายชื่อผู้เข้าชมล่าสุด</h2>
        <div id="latestVisitors"></div>
      </section>
    </div>

    <script>
      const totalVisitorsEl = document.getElementById("totalVisitors");
      const updatedAtEl = document.getElementById("updatedAt");
      const participantTypesEl = document.getElementById("participantTypes");
      const zonesEl = document.getElementById("zones");
      const latestVisitorsEl = document.getElementById("latestVisitors");

      loadStats();
      setInterval(loadStats, 10000);

      function loadStats() {
        google.script.run
          .withSuccessHandler(renderDashboard)
          .withFailureHandler(handleError)
          .getTodayVisitorStats();
      }

      function renderDashboard(data) {
        totalVisitorsEl.textContent = data.total || 0;
        updatedAtEl.textContent = "อัปเดตล่าสุด: " + (data.updatedAt || "-");

        renderBarList(participantTypesEl, data.participantTypes || {}, data.total || 0);
        renderBarList(zonesEl, data.zones || {}, data.total || 0);
        renderLatestVisitors(data.latestVisitors || []);
      }

      function renderBarList(container, items, total) {
        const entries = Object.entries(items)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 6);

        if (entries.length === 0) {
          container.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>';
          return;
        }

        container.innerHTML = entries.map(([label, count]) => {
          const percent = total > 0 ? Math.round((count / total) * 100) : 0;

          return `
            <div class="bar-row">
              <div class="bar-head">
                <span>${escapeHtml(label)}</span>
                <span>${count} คน</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width: ${percent}%"></div>
              </div>
            </div>
          `;
        }).join("");
      }

      function renderLatestVisitors(rows) {
        if (!rows.length) {
          latestVisitorsEl.innerHTML = '<div class="empty">ยังไม่มีผู้ลงทะเบียนเข้าชมวันนี้</div>';
          return;
        }

        latestVisitorsEl.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>เวลา</th>
                <th>ลำดับ</th>
                <th>ชื่อ - นามสกุล</th>
                <th>หน่วยงาน</th>
                <th>ประเภท</th>
                <th>โซนที่สนใจ</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  <td>${escapeHtml(row.time)}</td>
                  <td>${escapeHtml(row.visitorNo)}</td>
                  <td><strong>${escapeHtml(row.fullName)}</strong></td>
                  <td>${escapeHtml(row.organization || "-")}</td>
                  <td>${escapeHtml(row.participantType || "-")}</td>
                  <td>${escapeHtml(row.zone || "-")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      function handleError(error) {
        updatedAtEl.textContent =
          "โหลดข้อมูลไม่สำเร็จ: " + (error.message || "เกิดข้อผิดพลาด");
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
